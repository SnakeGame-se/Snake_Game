name: Snake Game C Build and Tests

on:
  push:
    branches: ["main", "SG-*"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc

      - name: Compile Snake Game
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic \
            main.c game_engine.c game_interface.c score_manager.c food.c \
            -o snake

      - name: Compile and Run Automated Tests
        run: |
          set -e

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_collision.c game_engine.c score_manager.c food.c \
            -o test_collision
          ./test_collision

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_engine_initialization.c game_engine.c score_manager.c food.c \
            -o test_engine_initialization
          ./test_engine_initialization

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_food.c food.c \
            -o test_food
          ./test_food

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_food_growth.c game_engine.c score_manager.c food.c \
            -o test_food_growth
          ./test_food_growth

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_game_over.c game_engine.c score_manager.c food.c \
            -o test_game_over
          ./test_game_over

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_pause_resume.c game_engine.c score_manager.c food.c \
            -o test_pause_resume
          ./test_pause_resume

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_restart.c game_engine.c score_manager.c food.c \
            -o test_restart
          ./test_restart

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_score.c score_manager.c \
            -o test_score
          ./test_score

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_score_display.c game_interface.c \
            -o test_score_display
          ./test_score_display

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_self_collision.c game_engine.c score_manager.c food.c \
            -o test_self_collision
          ./test_self_collision

          gcc -std=c11 -Wall -Wextra -Wpedantic \
            tests/test_snake_movement.c game_engine.c score_manager.c food.c \
            -o test_snake_movement
          ./test_snake_movement